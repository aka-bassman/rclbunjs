name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests and typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx tsc --noEmit -p test/types
      - run: bun test test/unit

  integration:
    name: integration (${{ matrix.distro }}, ${{ matrix.arch }}, ${{ matrix.rmw }})
    needs: unit
    # arm64 uses GitHub's hosted arm runners (available for public repositories)
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, kilted]
        arch: [x64, arm64]
        rmw: [rmw_fastrtps_cpp]
        include:
          - distro: jazzy
            arch: x64
            rmw: rmw_cyclonedds_cpp
    env:
      ROS_DISTRO: ${{ matrix.distro }}
      RMW_IMPLEMENTATION: ${{ matrix.rmw }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # node_modules is installed on the host and mounted into the container
      - run: bun install --frozen-lockfile
      - name: Build the ROS 2 test image
        run: docker build -t "rclbunjs-dev:${ROS_DISTRO}" --build-arg ROS_DISTRO="${ROS_DISTRO}" docker
      - name: Integration tests (shim compiled at runtime by TinyCC)
        run: scripts/docker-test.sh bun test test/integration
      - name: Integration tests (prebuilt shim from scripts/build-native.sh)
        if: matrix.rmw == 'rmw_fastrtps_cpp'
        run: >-
          scripts/docker-test.sh bash -c
          'scripts/build-native.sh && RCLBUN_SHIM=build/librclbunjs_shim.so bun test test/integration'
